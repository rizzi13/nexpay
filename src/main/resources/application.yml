spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nexpaydb
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: nexpay-super-secret-key-for-jwt-signing-minimum-256-bits-long
  expiration: 86400000
